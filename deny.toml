# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # chrono is an optional dependency behind the `rollback` feature, and its
    # `DateTime<Utc>` is part of the public API. RUSTSEC-2026-0543 is an
    # "unmaintained" notice, not a vulnerability; the migration is tracked in
    # https://github.com/sadco-io/hotswap-config/issues/17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration tracked in sadco-io/hotswap-config#17" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # notify (CC0-1.0) and tiny-keccak via ahash/const-random. CC0-1.0 is a
    # public-domain dedication: permissive, no obligations, FSF Free/Libre.
    "CC0-1.0",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
