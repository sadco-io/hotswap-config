name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The PR run already tested this exact tree -- strict status checks
      # require the branch to be current with the default branch before it can
      # merge -- so the post-merge run re-verifies content that just passed.
      # It still runs, to keep the CI badge and a real smoke signal on the
      # default branch, but the matrix collapses to one representative leg.
      matrix:
        rust: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["stable","beta"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `remote-native-tls` links OpenSSL via reqwest's native-tls backend.
      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test --all-features --lib --tests --examples
      - run: cargo check --all-features --benches
      - run: cargo test --all-features --doc
      - run: cargo test --no-default-features --features validation
      # Standalone `--no-default-features` checks so feature-gate regressions cannot slip through.
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features rollback,yaml --examples
      - run: cargo check --no-default-features --features gradual-rollout,yaml --examples
      - run: cargo check --no-default-features --features partial-updates,yaml --examples
      - run: cargo check --no-default-features --features metrics
      - run: cargo check --no-default-features --features remote --examples
      - run: cargo check --no-default-features --features remote-native-tls
      # Each TLS backend must build on its own with default features too.
      - run: cargo check --features remote
      - run: cargo check --features remote-native-tls

  msrv:
    name: msrv (1.87.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Build only: dev-dependencies are allowed to outrun the MSRV.
      - run: cargo build --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
